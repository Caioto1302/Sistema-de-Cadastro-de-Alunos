<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniClass</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script type="module" crossorigin src="/assets/main-BhoIjWYV.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/assets/config-DPSuE5lU.js">
  <link rel="modulepreload" crossorigin href="/assets/proteger-pagina-CCLhLS-N.js">
  <link rel="stylesheet" crossorigin href="/assets/main-5yQhwRuL.css">
  <link rel="stylesheet" crossorigin href="/assets/global-DNofd_KG.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <p class="nav-logo">UniClass</p>
        </nav>
    </header>

    <main class="main-auth">
        <div class="card">
            <div class="card-icon">
                <i class='bx bxs-graduation'></i>
            </div>
            <h1 class="card-title">Bem-vindo de volta!</h1>
            <p class="card-description">Acesse sua conta para continuar</p>
            <form id="login-form" action="#">
                <div class="form-group">
                    <input id="email" type="email" class="form-control" placeholder="Digite seu e-mail" required>
                    <i class='bx bxs-user form-icon'></i>
                </div>
                <div class="form-group">
                    <input id="password" type="password" class="form-control" placeholder="Digite sua senha" required>
                    <i class='bx bxs-lock-alt form-icon'></i>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <div class="links-extras">
                    <a href="./pages/recuperar-senha.html">Esqueceu a Senha?</a>
                    <span>Não tem conta? <a href="./pages/cadastro.html" class="link-danger">Registrar</a></span>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div id="footer-copyright">&copy; 2026 UniClass. Todos os direitos reservados.</div>
    </footer>
</body>
</html>
