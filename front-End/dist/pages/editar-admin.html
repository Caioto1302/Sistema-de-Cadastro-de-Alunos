<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Chamado - UniClass</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script type="module" crossorigin src="/assets/editarAdmin-nPCbqw5A.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/assets/config-DPSuE5lU.js">
  <link rel="modulepreload" crossorigin href="/assets/logout-B0Sq76Co.js">
  <link rel="modulepreload" crossorigin href="/assets/proteger-admin-B9nYTbku.js">
  <link rel="stylesheet" crossorigin href="/assets/editarAdmin-C5Kp_EnC.css">
  <link rel="stylesheet" crossorigin href="/assets/global-DNofd_KG.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="inicio.html" class="nav-logo">UniClass</a>
            <ul class="nav-menu">
                <li class="nav-pag"><a href="gerenciar-admin.html" class="active">Gerenciamento (admin)</a></li>
                <li class="nav-sub-item">
                    <a href="#" class="nav-chamados">Chamados <i class='bx bx-chevron-down arrow-down'></i></a>
                    <ul class="nav-submenu">
                        <li class="nav-sub-chamados"><a href="abertura-chamado.html">Abrir Chamado</a></li>
                        <li class="nav-sub-chamados"><a href="acompanhar-chamados.html">Acompanhar Chamados</a></li>
                    </ul>
                </li>
                <li class="nav-pag"><a href="sobre-nos.html">Sobre Nós</a></li>
                <li class="nav-pag"><a href="ajuda.html">Ajuda</a></li>
                <li class="nav-pag"><a href="#" id="logout-link">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Card for Ticket Details & Status Change -->
            <div class="card" id="detalhes-chamado-card">
                <!-- O conteúdo detalhado do chamado será injetado aqui pelo JavaScript -->
            </div>

            <!-- Section for Responses -->
            <div class="respostas-section">
                <h2 class="section-title"><i class='bx bxs-conversation'></i> Histórico de Respostas</h2>
                <div id="respostas-lista">
                    <!-- As respostas serão injetadas aqui pelo JavaScript -->
                </div>
            </div>

            <!-- Card for Adding a New Response -->
            <div class="card" id="nova-resposta-card">
                <h2 class="card-title">Adicionar Nova Resposta</h2>
                <form id="nova-resposta-form">
                    <div class="form-group">
                        <label for="mensagem">Sua Resposta</label>
                        <textarea id="mensagem" name="mensagem" class="form-control" placeholder="Digite sua resposta para o usuário..." required rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar Resposta</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer-copyright">

    </footer>
    
</body>
</html>
