<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniClass</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">
    <script type="module" src="./scripts/proteger-pagina.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="./index.html" class="nav-logo">UniClass</a>
        </nav>
    </header>

    <main class="main-auth">
        <div class="card">
            <div class="card-icon">
                <i class='bx bxs-graduation'></i>
            </div>
            <h1 class="card-title">Bem-vindo de volta!</h1>
            <p class="card-description">Acesse sua conta para continuar</p>
            <form id="login-form" action="#">
                <div class="form-group">
                    <input id="email" type="email" class="form-control" placeholder="Digite seu e-mail" required>
                    <i class='bx bxs-user form-icon'></i>
                </div>
                <div class="form-group">
                    <input id="password" type="password" class="form-control" placeholder="Digite sua senha" required>
                    <i class='bx bxs-lock-alt form-icon'></i>
                    <i class='bx bx-hide toggle-password'></i>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <div class="links-extras">
                    <a href="./pages/recuperar-senha.html">Esqueceu a Senha?</a>
                    <span>Não tem conta? <a href="./pages/cadastro.html" class="link-danger">Registrar</a></span>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div id="footer-copyright">&copy; 2026 UniClass. Todos os direitos reservados.</div>
    </footer>
    <script type="module" src="./scripts/login.js"></script>
    <script type="module" src="./scripts/toggle-password.js"></script>
</body>
</html>
