<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha - UniClass</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/redefinir-senha.css">
    <script type="module" src="../scripts/proteger-pagina.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="nav-logo">UniClass</a>
        </nav>
    </header>

    <main class="main-auth">
        <div class="card">
            <div class="card-icon">
                <i class='bx bxs-shield-lock'></i>
            </div>
            <h1 class="card-title">Redefina sua Senha</h1>
            <p class="card-description">
                Crie uma nova senha forte e segura para sua conta.
            </p>

            <form id="redefinir-form">
                <div class="form-group">
                    <input id="nova-senha" type="password" class="form-control" placeholder="Digite sua nova senha" required>
                    <i class='bx bxs-lock-alt form-icon'></i>
                    <i class='bx bx-hide toggle-password'></i>
                </div>
                <div class="form-group">
                    <i class='bx bxs-lock-alt form-icon'></i>
                    <input id="confirmar-senha" type="password" class="form-control" placeholder="Repita sua nova senha" required>
                </div>

                <button type="submit" class="btn btn-primary">Redefinir Senha</button>

                <div class="links-extras">
                    <p>Lembrou sua senha? <a href="../index.html">Faça o login</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div id="footer-copyright">&copy; 2026 UniClass. Todos os direitos reservados.</div>
    </footer>

    <script type="module" src="../scripts/redefinir-senha.js"></script>
    <script type="module" src="../scripts/toggle-password.js"></script>
</body>
</html>
