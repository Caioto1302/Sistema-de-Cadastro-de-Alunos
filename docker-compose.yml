version: '3.8'

services:
  # Back-end
  backend:
    build: ./back-end
    image: sistema-chamados-backend:v1
    container_name: sistema-backend
    env_file:
      - ./back-end/.env
    ports:
      - "5000:5000"

  # Front-end
  frontend:
    build: ./front-End
    image: sistema-chamados-frontend:v1
    container_name: sistema-frontend
    ports:
      - "5173:80" # Direciona a porta 5173 do seu PC para a porta 80 do Nginx
